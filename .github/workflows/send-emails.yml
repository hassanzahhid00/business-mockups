name: Send outreach emails

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      lead:
        description: "Optional: send only this business name (leave empty for the next batch)"
        required: false
        default: ""
      override:
        description: "Go beyond the daily cap of 5"
        required: false
        type: boolean
        default: false
      backfill:
        description: "Only file queued Sent-folder copies (no new emails sent)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send automated daily queue (scheduled runs)
        if: github.event_name == 'schedule'
        env:
          PURELYMAIL_USER: ${{ secrets.PURELYMAIL_USER }}
          PURELYMAIL_APP_PASSWORD: ${{ secrets.PURELYMAIL_APP_PASSWORD }}
        run: python3 send_emails.py --daily

      - name: Send emails via PurelyMail
        if: github.event_name != 'schedule'
        env:
          PURELYMAIL_USER: ${{ secrets.PURELYMAIL_USER }}
          PURELYMAIL_APP_PASSWORD: ${{ secrets.PURELYMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.lead }}" ]; then ARGS="$ARGS --lead \"${{ inputs.lead }}\""; fi
          if [ "${{ inputs.override }}" = "true" ]; then ARGS="$ARGS --override"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          eval "python3 send_emails.py $ARGS"

      - name: Save updated queue and statuses
        run: |
          git config user.name "Lead Dashboard Bot"
          git config user.email "hassan.zahid@developers-hub.co.uk"
          git add send_queue.json statuses.json backfill_queue.json daily_queue.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update outreach queue and statuses after send run"
            git push
          fi

      - name: Sync Lead Command Center portal
        if: always()
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 portal_sync.py
